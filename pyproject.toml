[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "localalibiscan"
version = "0.0.1"
description = "Every claim has an alibi. Local tool that profiles every project on your disk and proves each claim with file and line."
readme = "SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pathspec>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
localalibiscan = "localalibiscan.cli:main"
las = "localalibiscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localalibiscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
